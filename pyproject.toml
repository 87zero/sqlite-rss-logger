[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-rss-logger"
version = "0.1.0"
description = "A logging handler that writes to one SQLite database per application, plus a FastAPI service that publishes the latest records of all databases as an RSS feed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "87zero" }]
keywords = ["logging", "sqlite", "rss", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
]
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "rich>=13",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/87zero/sqlite-rss-logger"
Issues = "https://github.com/87zero/sqlite-rss-logger/issues"

[project.scripts]
sqlite-rss-logger = "sqlite_rss_logger.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_rss_logger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# FastAPI declares parameters with Query(...) defaults.
ignore = ["B008"]
